AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Execution role of the EXAMEN pipeline on AgentCore Runtime (docs/17_aws_deployment_runbook.md §5.4).
  The runtime itself is created by scripts/agentcore_deploy.py (direct code deployment from S3).

Parameters:
  ArtifactBucket:
    Type: String
    Description: Bucket holding agentcore/<sha>.zip
  AgentCoreDataPolicyArn:
    Type: String
    Default: arn:aws:iam::301356686376:policy/examen-agentcore-data
    Description: Output AgentCoreDataPolicyArn of the examen-data stack (tenant role, shared ops partitions)

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: examen-agentcore-runtime
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      ManagedPolicyArns:
        - !Ref AgentCoreDataPolicyArn
      Policies:
        - PolicyName: examen-agentcore-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Models  # Converse / ConverseStream are authorised by InvokeModel*
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:CallWithBearerToken]
                Resource: "*"
              - Sid: Code
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/agentcore/*"
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams,
                         logs:DescribeLogGroups]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*"
              - Sid: Tracing
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadIdentity
                Effect: Allow
                Action: [bedrock-agentcore:GetWorkloadAccessToken, bedrock-agentcore:GetWorkloadAccessTokenForJWT,
                         bedrock-agentcore:GetWorkloadAccessTokenForUserId]
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"

Outputs:
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
